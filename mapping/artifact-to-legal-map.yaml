schema: foundry-artifact-legal-map-v1
# Maps every artifact type to: token source, footer templates, license.
# Consuming tools read this file to validate footer compliance at commit time.
# Updated whenever: new artifact type added, footer template created, license changes.
#
# Note (2026-08-02): confirmed unconsumed — no script in this repo or elsewhere
# currently reads this file. "license" values here are descriptive labels for
# a footer-validation tool that doesn't exist yet, not live inputs to
# propagate-licenses.sh/verify-repo-compliance.sh (those read
# mapping/repo-license-map.yaml instead, a separate catalog).
#
# "copyright-only" (used below by GUIDE/TEXT/COMMS/LEGAL/RUNBOOK) = no open
# license grant; a bare copyright notice, all rights reserved. Deliberately
# distinct from PointSav-ARR (mapping/repo-license-map.yaml), which carries
# real license terms, restrictions, and a trademark carve-out — these artifact
# types need only a copyright statement in the footer, not the full PointSav-ARR
# license text. It is not, and is not meant to be, a key in
# repo-license-map.yaml's `licenses:` catalog.
artifacts:
  TOPIC:
    token: tokens/legal-tokens-woodfine.yaml
    footer_en: readmes/footer-topic-en.md
    footer_es: readmes/footer-topic-es.md
    license: CC-BY-4.0   # default — content-wiki-documentation / media-knowledge-documentation (pointsav org)
    license_overrides:   # corrected 2026-08-02 — was unconditionally CC-BY-4.0, mismatched LICENSE-MATRIX.md §3.2
      content-wiki-corporate: CC-BY-ND-4.0
      media-knowledge-corporate: CC-BY-ND-4.0
      content-wiki-projects: CC-BY-ND-4.0
      media-knowledge-projects: CC-BY-ND-4.0
    bilingual: true   # applies to the CC-BY-4.0 default only; CC-BY-ND-4.0 destinations
                       # are English-only per LICENSE-MATRIX.md §3.3 (no translations permitted)
  GUIDE:
    token: tokens/legal-tokens-woodfine.yaml
    footer_en: readmes/footer-guide-en.md
    footer_es: readmes/footer-guide-es.md
    license: copyright-only
    bilingual: true
  TEXT:
    token: tokens/legal-tokens-woodfine.yaml
    footer_en: readmes/footer-text-en.md
    footer_es: readmes/footer-text-es.md
    license: copyright-only
    bilingual: true
  COMMS:
    token: tokens/legal-tokens-woodfine.yaml
    footer_en: readmes/footer-comms-en.md
    footer_es: readmes/footer-comms-es.md
    license: copyright-only
    bilingual: true
  LEGAL:
    token: tokens/legal-tokens-woodfine.yaml
    footer_en: readmes/footer-legal-en.md
    footer_es: null
    license: copyright-only
    bilingual: false
  RUNBOOK:
    token: tokens/legal-tokens-woodfine.yaml
    footer_en: readmes/footer-runbook-en.md
    footer_es: null
    license: copyright-only
    bilingual: false
  README:
    token: per-LICENSE-MATRIX
    footer_en: readmes/footer-readme-en.md
    footer_es: readmes/footer-readme-es.md
    license: per-LICENSE-MATRIX.md
    bilingual: true
  DESIGN:
    token: tokens/legal-tokens-pointsav.yaml
    footer_en: readmes/footer-design-en.md
    footer_es: null
    license: Apache-2.0
    bilingual: false
    note: project-design to validate scope before committing footer-design-en.md
  ASSET:
    token: tokens/legal-tokens-woodfine.yaml
    footer_en: null
    footer_es: null
    license: PointSav-ARR
    bilingual: false
    note: binary assets carry no text footer
