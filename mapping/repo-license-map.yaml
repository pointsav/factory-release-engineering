# factory-release-engineering / mapping / repo-license-map.yaml
#
# Authoritative machine-readable mapping from repository → license.
# Human-readable companion: /LICENSE-MATRIX.md
# Read by: /scripts/propagate-licenses.sh
#          /scripts/add-spdx-headers.sh
#          /scripts/verify-repo-compliance.sh
#
# Divergence between this file and LICENSE-MATRIX.md is a defect.
# Both files must be updated in the same PR.

version: "1.0"
effective_date: "2026-04-20"

# ============================================================================
# Defaults applied to every repository unless overridden at repo level.
# ============================================================================
defaults:
  copyright_holder: "Woodfine Capital Projects Inc."
  contacts:
    open_source: "open.source@pointsav.com"             # security, conduct, community
    corporate: "corporate.secretary@woodfinegroup.com"  # licensing, trademark, CLA, legal
  governing_law: "Ontario"
  year: "2026"
  baseline_policies:
    - CODE_OF_CONDUCT            # incorporated into every repo regardless of license

# ============================================================================
# License catalog.
# Properties of each license the platform uses. Keyed by SPDX identifier where
# one exists; otherwise by the filename stem in licenses/.
# ============================================================================
licenses:

  AGPL-3.0-or-later:
    license_file: licenses/AGPL-3.0.txt
    header_template: headers/agpl-3.0-header.txt
    policies: [CODE_OF_CONDUCT, CONTRIBUTING, SECURITY]
    bilingual_readme: true
    notice_file: optional
    requires_cla: true

  Apache-2.0:
    license_file: licenses/Apache-2.0.txt
    header_template: headers/apache-2.0-header.txt
    policies: [CODE_OF_CONDUCT, CONTRIBUTING, SECURITY]
    bilingual_readme: true
    notice_file: required        # Apache-2.0 §4(d) — Woodfine-authored NOTICE.
    requires_cla: false

  FSL-1.1-ALv2:
    # RETIRED 2026-09-25 (LICENSE-MATRIX.md §4.7) -- no new assignments.
    # Kept in the catalog (not deleted) because propagation/verify scripts
    # still need to recognize it on existing source until each owning
    # archive executes its own Cargo.toml/SPDX flip.
    license_file: licenses/FSL-1.1-Apache-2.0.txt
    header_template: headers/fsl-1.1-header.txt
    policies: [CODE_OF_CONDUCT, CONTRIBUTING, SECURITY]
    bilingual_readme: true
    notice_file: optional
    requires_cla: true
    template_substitutions:      # placeholders in the license text itself
      "${year}": "2026"
      "${licensor name}": "Woodfine Capital Projects Inc."

  CC-BY-4.0:
    license_file: licenses/CC-BY-4.0.txt
    header_template: null        # content license — no per-source-file SPDX header
    policies: [CODE_OF_CONDUCT]
    bilingual_readme: true
    notice_file: null
    requires_cla: false

  CC-BY-ND-4.0:
    license_file: licenses/CC-BY-ND-4.0.txt
    header_template: null
    policies: [CODE_OF_CONDUCT]
    bilingual_readme: false      # CC BY-ND prohibits derivative works incl.
                                 # translations — repo is English-only in
                                 # public distribution.
    english_only: true
    notice_file: null
    requires_cla: false

  PointSav-ARR:
    license_file: licenses/PointSav-ARR.txt
    header_template: headers/proprietary-header.txt
    header_substitutions:
      "${proprietary-license-id}": "LicenseRef-PointSav-ARR"
    policies: [TRADEMARK, SECURITY]
    bilingual_readme: true
    notice_file: null
    requires_cla: false
    commercial_alternative: PointSav-Commercial

  PointSav-Commercial:
    license_file: licenses/PointSav-Commercial.txt
    header_template: headers/proprietary-header.txt
    header_substitutions:
      "${proprietary-license-id}": "LicenseRef-PointSav-Commercial"
    policies: [TRADEMARK, SECURITY]
    bilingual_readme: false
    notice_file: null
    requires_cla: false
    distribution: order-form      # NOT applied as LICENSE file in public repos;
                                  # delivered per executed Order Form only.

  EUPL-1.2:
    # DEF-002 open — license_file and header_template are stubs until the
    # canonical EUPL-1.2 text is downloaded. Do not run propagation scripts
    # against EUPL-1.2 directories until DEF-002 is closed.
    license_file: licenses/EUPL-1.2.txt        # pending DEF-002
    header_template: headers/eupl-1.2-header.txt  # minimal stub — pending DEF-002
    policies: [CODE_OF_CONDUCT, CONTRIBUTING, SECURITY]
    bilingual_readme: true
    notice_file: optional
    requires_cla: false           # EUPL-1.2 has no Woodfine-specific CLA obligation

  MIXED:
    # Used for monorepos containing multiple licenses at the directory
    # level. The propagation script writes MIXED-MONOREPO-NOTICE.txt as
    # LICENSE and relies on per-directory SPDX headers for actual
    # licensing disambiguation.
    license_file: licenses/MIXED-MONOREPO-NOTICE.txt
    header_template: null         # per-directory via monorepo_directories
    policies: [CODE_OF_CONDUCT, CONTRIBUTING, SECURITY, TRADEMARK]
    bilingual_readme: true
    notice_file: null
    requires_cla: true            # monorepo contains AGPL/FSL directories

# ============================================================================
# Repositories.
# Each entry assigns exactly one license to exactly one repository.
# ============================================================================
repositories:

  # ---- pointsav GitHub org ----

  - name: pointsav-monorepo
    organization: pointsav
    license: MIXED
    note: "Multi-license monorepo. Per-directory licensing in monorepo_directories."

  - name: content-wiki-documentation
    organization: pointsav
    license: CC-BY-4.0
    note: "Legacy name retained for staging-mirror compatibility. Canonical name: media-knowledge-documentation."

  - name: media-knowledge-documentation
    organization: pointsav
    license: CC-BY-4.0
    note: "Renamed from content-wiki-documentation 2026-05. Canonical name in use at GitHub."

  - name: pointsav-design-system
    organization: pointsav
    license: Apache-2.0

  - name: pointsav-fleet-deployment
    organization: pointsav
    license: PointSav-ARR

  - name: pointsav-media-assets
    organization: pointsav
    license: PointSav-ARR

  - name: pointsav.github.io
    organization: pointsav
    license: Apache-2.0

  - name: factory-release-engineering
    organization: pointsav
    license: MIXED
    note: "This repository. Content is the canonical source; LICENSE-NOTICE explains per-file licensing."

  - name: .github
    organization: pointsav
    license: CC-BY-4.0
    note: "Org-level profile README only (profile/README.md + .es.md), no code."

  # ---- woodfine GitHub org ----

  - name: content-wiki-corporate
    organization: woodfine
    license: CC-BY-ND-4.0
    note: "Legacy name retained for staging-mirror compatibility. Canonical name: media-knowledge-corporate."

  - name: media-knowledge-corporate
    organization: woodfine
    license: CC-BY-ND-4.0
    note: "Renamed from content-wiki-corporate 2026-05. Canonical name in use at GitHub."

  - name: content-wiki-projects
    organization: woodfine
    license: CC-BY-ND-4.0
    note: "Legacy name retained for staging-mirror compatibility. Canonical name: media-knowledge-projects."

  - name: media-knowledge-projects
    organization: woodfine
    license: CC-BY-ND-4.0
    note: "Renamed from content-wiki-projects 2026-05. Canonical name in use at GitHub."

  - name: woodfine-bim-library
    organization: woodfine
    license: Apache-2.0
    note: "BIM Object Library — DTCG token data files covered by repo-level LICENSE."

  - name: woodfine-fleet-deployment
    organization: woodfine
    license: PointSav-ARR

  - name: woodfine-media-assets
    organization: woodfine
    license: PointSav-ARR

  - name: woodfine.github.io
    organization: woodfine
    license: Apache-2.0

  - name: .github
    organization: woodfine
    license: CC-BY-4.0
    note: "Org-level profile README only (profile/README.md + .es.md), no code."

# ============================================================================
# Monorepo per-directory licensing.
# Used by propagate-licenses.sh and add-spdx-headers.sh when operating
# inside a repository whose top-level license is MIXED.
#
# Matching rule: longest-prefix match. Exact directory names (ending in /)
# override prefix patterns. Unmatched directories are a defect.
# ============================================================================
monorepo_directories:

  # ---- Exact os-* module directories ----
  # 2026-09-25 (LICENSE-MATRIX.md §4.7): FSL-1.1-ALv2 retired as policy; the
  # os-console/os-totebox Apache-2.0 relicense (proposed+BLOCKED 2026-09-01,
  # §4.1c) is unblocked via dependency relicense (system-core/-ledger/
  # -gateway-mba, service-content, os-totebox's own daemon set -- see the
  # exact-override block below). RATIFIED, PENDING each owning archive's own
  # Cargo.toml/SPDX execution -- this file records the new source of truth;
  # it does not itself stamp source files.
  "os-console/":         Apache-2.0     # was AGPL-3.0-or-later; unblocked 2026-09-25, pending project-console execution
  "os-privategit/":      Apache-2.0     # was FSL-1.1-ALv2 (corrected 2026-07-07); FSL retired 2026-09-25, zero AGPL-tier deps, pending project-software execution
  "os-totebox/":         Apache-2.0     # was FSL-1.1-ALv2 (corrected 2026-07-07); FSL retired + unblocked 2026-09-25, pending project-totebox execution
  "os-workplace/":       Apache-2.0     # was AGPL-3.0-or-later; whole os-workplace/app-workplace-* family moves 2026-09-25, pending project-workplace execution
  "os-infrastructure/":  AGPL-3.0-or-later   # was FSL-1.1-ALv2; FSL retired 2026-09-25, resolves to AGPL (explicitly named staying-AGPL), pending project-infrastructure execution
  # os-interface/ and os-orchestration/ removed 2026-09-01 — extracted to
  # pointsav/pointsav-orchestration-private (private repo) after ~3 months of public
  # exposure of the real license-enforcement source; see LICENSE-MATRIX.md §4.1b.
  # os-mediakit/: relicensed to Apache-2.0 2026-09-01 (was FSL-1.1-ALv2) -- linking-boundary
  # audit clean; reconfirmed correct 2026-09-25 against an independent unaudited later
  # conclusion that had argued AGPL. See LICENSE-MATRIX.md §4.1c, §4.7.
  "os-mediakit/":        Apache-2.0
  "os-network-admin/":   AGPL-3.0-or-later   # was FSL-1.1-ALv2; FSL retired 2026-09-25, resolves to AGPL (same reasoning as os-infrastructure), pending project-infrastructure execution

  # ---- Exact overrides of prefix patterns (longest-prefix match: exact wins) ----
  # Added 2026-07-07 — see BRIEF-software-licensing-structure.md (Command-scope) for full reasoning.
  # tool-wallet/'s Apache-2.0 exception reversed 2026-09-01 -- no longer an override, matches
  # the tool-* default (AGPL-3.0-or-later) directly. moonshot-docengine/editor/crdt/parser/
  # bim-engine's FSL-1.1-ALv2 overrides removed 2026-09-01 -- moonshot-* default itself moved
  # to Apache-2.0 below, so these 5 now match the default and no longer need an override.
  # moonshot-sel4-vmm/ is a NEW override added 2026-09-01, in the opposite direction -- excluded
  # from the moonshot-* Apache move, stays AGPL-3.0-or-later pending legal review of its GPL-2.0
  # ABI-coupling to vendor-sel4-kernel (seL4 Protection Domain, syscall-level integration, not
  # caught by a Cargo path-dependency check). See LICENSE-MATRIX.md §4.2a for full reasoning.
  "moonshot-sel4-vmm/":      AGPL-3.0-or-later

  # ---- New exact overrides, 2026-09-25 linkage-surface boundary rule ----
  # See LICENSE-MATRIX.md §4.2a (continued), §4.7. RATIFIED, PENDING each
  # owning archive's own Cargo.toml/SPDX execution.
  "system-core/":              Apache-2.0   # was AGPL (system-* default); only 3 of 22 system-* move, verified via direct dependency check
  "system-ledger/":            Apache-2.0   # was AGPL (system-* default); same verification as system-core/
  "system-gateway-mba/":       Apache-2.0   # was AGPL (system-* default); whole crate (single Cargo.toml, [[bin]] targets only, no lib/bin license split possible)
  "service-content/":          Apache-2.0   # was AGPL (service-* default); named explicitly, also unblocks os-totebox (§4.1c)
  "service-fs/":                Apache-2.0   # was AGPL (service-* default); os-totebox's own declared bundled-daemon binary set
  "service-input/":             Apache-2.0   # was AGPL (service-* default); os-totebox's own declared bundled-daemon binary set
  "service-people/":            Apache-2.0   # was AGPL (service-* default); os-totebox's own declared bundled-daemon binary set
  "service-email/":              Apache-2.0   # was AGPL (service-* default); os-totebox's own declared bundled-daemon binary set
  "service-extraction/":        Apache-2.0   # was AGPL (service-* default); os-totebox's own declared bundled-daemon binary set
  "service-http/":               Apache-2.0   # was AGPL (service-* default); os-totebox's own declared bundled-daemon binary set
  "service-ingress/":            Apache-2.0   # was AGPL (service-* default); os-totebox's own declared bundled-daemon binary set
  # service-slm's Doorman-side sub-crates -- nested-path exact override (longest-prefix
  # match works against the full relative path, confirmed by reading add-spdx-headers.sh's
  # resolve_file_license() directly -- plain string-prefix match, not top-level-only).
  # service-slm/router/, crates/slm-core/, crates/adapter-hub/ are NOT named and stay AGPL
  # under the service- default -- do not assume the whole service-slm/ family moved.
  "service-slm/crates/slm-doorman/":         Apache-2.0
  "service-slm/crates/slm-doorman-server/":  Apache-2.0
  "service-slm/crates/slm-mcp-server/":      Apache-2.0
  "tool-typeset/":              Apache-2.0   # was AGPL (tool-* default); reverses the 2026-07-07 round-11 decision
  "tool-wiki-core/":             Apache-2.0   # was AGPL (tool-* default); same reversal as tool-typeset/
  # console-core/ moved 2026-09-25 -- see its own entry below (kept at its original
  # place in the file rather than duplicated here, to avoid a duplicate-YAML-key defect).

  # ---- Platform-wide prefix patterns (all AGPL except moonshot-*, see above) ----
  "service-":            AGPL-3.0-or-later
  "system-":             AGPL-3.0-or-later
  "tool-":               AGPL-3.0-or-later
  "moonshot-":           Apache-2.0   # was AGPL-3.0-or-later; relicensed 2026-09-01, moonshot-sel4-vmm/ excluded above

  # ---- app-* inheritance rule ----
  # app-<domain>-<thing> inherits the license of os-<domain>.
  # Patterns match any directory beginning with the prefix.
  # app-console-*: os-console relicense to Apache-2.0 proposed 2026-09-01 but BLOCKED (real
  # AGPL-tier path deps in app-console-content/app-console-system) -- stays AGPL. See
  # LICENSE-MATRIX.md §4.1c.
  "app-console-":        Apache-2.0   # was AGPL; unblocked+ratified 2026-09-25, moves with os-console, pending project-console execution
  "app-privategit-":     Apache-2.0   # was FSL-1.1-ALv2 (corrected 2026-08-02); FSL retired 2026-09-25, moves with os-privategit, pending project-software/project-design execution
  "app-totebox-":        Apache-2.0   # was FSL-1.1-ALv2 (corrected 2026-08-02); FSL retired+unblocked 2026-09-25, moves with os-totebox, pending project-totebox execution
  "app-workplace-":      Apache-2.0   # was AGPL; whole os-workplace/app-workplace-* family moves 2026-09-25, pending project-workplace execution
  "app-mediakit-":       Apache-2.0   # was FSL-1.1-ALv2; relicensed 2026-09-01, inherits os-mediakit's move
  "app-network-":        AGPL-3.0-or-later   # was FSL-1.1-ALv2; FSL retired 2026-09-25, resolves to AGPL, pending project-infrastructure execution
  # app-orchestration-* removed 2026-09-01 — see os-interface/os-orchestration note above.

  # ---- Workspace infrastructure (AGPL) ----
  "xtask/":              AGPL-3.0-or-later
  "pointsav-pty-bridge/": AGPL-3.0-or-later

  # ---- Additional tracked directories ----
  # Added 2026-05-24 — previously unmatched (defects per §4.4); resolved in audit.
  "foundry-nodeclass/":  AGPL-3.0-or-later   # workspace node classification library
  "scripts/":            AGPL-3.0-or-later   # build and automation scripts
  "slm/":                AGPL-3.0-or-later   # language model module configuration
  "docs/":               AGPL-3.0-or-later   # internal technical documentation
  "templates/":          Apache-2.0          # was FSL-1.1-ALv2; FSL retired 2026-09-25, matches app-mediakit-* (its own surface), pending project-editorial/project-software execution
  "vendor-virtio/":      upstream             # virtio stubs; README states upstream SPDX
  "vendor-wireguard/":   upstream             # WireGuard tooling; README states upstream SPDX

  # ---- Vendored upstream code (corrected 2026-08-02) ----
  # These are git-tracked (confirmed via `git ls-tree`), NOT gitignored/local-only as
  # previously claimed here — that claim was factually wrong per the 2026-08-02 audit.
  # "upstream" = vendored third-party code under its own license; not propagated or
  # relicensed by this repo's scripts. Matches the existing vendor-virtio/vendor-wireguard
  # pattern above (§4.4).
  "vendor-azure-auth/":     upstream   # upstream Microsoft license
  "vendor-gpu-drivers/":    upstream   # upstream vendor license
  "vendor-linux-systemd/":  upstream   # LGPL-2.1-or-later
  "vendor-microsoft-graph/": upstream   # upstream Microsoft license
  "vendor-phi3-mini/":      upstream   # MIT (Phi-3 Mini model, Microsoft Research)
  "vendor-sel4-kernel/":    upstream   # GPL-2.0-only (Data61/CSIRO)
  "vendor-slm-engine/":     upstream   # upstream vendor license

  # console-core/: classified 2026-09-01 -- found real, git-tracked, depended on (path dep)
  # by app-console-keys during tonight's licensing linking-boundary audit. Pure-std "os-console
  # interaction core," no external deps of its own -- inherits os-console's tier directly.
  # 2026-09-25: moves to Apache-2.0 alongside os-console (LICENSE-MATRIX.md §4.2a, §4.7);
  # explicitly named in the ratification rather than left pinned to os-console's pre-relicense
  # tier. RATIFIED, PENDING project-console's own Cargo.toml/SPDX execution.
  "console-core/":       Apache-2.0

  # ---- Genuinely unmatched — pending classification (2026-08-02 audit) ----
  # Real, tracked directories with no license assignment yet. Do NOT propagate/stamp
  # against these until each is classified. See LICENSE-MATRIX.md §4.6 for the full list
  # and follow-up plan; NEXT.md tracks this as a defect.
  # app-infrastructure-cloud/, app-infrastructure-leased/, app-infrastructure-onprem/,
  # bread/, briefs/, data/, discovery-queue/ (confirmed genuinely gitignored,
  # unlike the vendor-* dirs above), infrastructure/, JOURNAL/, proposed/, SUMMARY/, work/,
  # workplace-shell-chrome/, vendor-libvmm/, vendor-sel4-project/, vendor-sel4-tools/,
  # vendor-tantivy/, vendor-tantivy-columnar/, vendor-tantivy-common/
  # "discovery-queue/":      local-only — operational data, gitignored 2026-05-24
